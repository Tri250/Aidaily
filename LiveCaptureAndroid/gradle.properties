org.gradle.jvmargs=-Xmx1400m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.java.home=/root/.local/share/mise/installs/java/17.0.2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 网络加速：短超时快速失败重试可达镜像
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=3

# Proxy（沙箱环境需通过本地代理访问外网）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local|::1

# Release signing
RELEASE_STORE_PASSWORD=livecapture123
RELEASE_KEY_ALIAS=livecapture
RELEASE_KEY_PASSWORD=livecapture123