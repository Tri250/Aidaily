# Windows 版：打包、冒烟测试、生成安装程序和便携版 zip。
# 手动运行（Actions → build-windows → Run workflow），或推送 v* 标签时运行并上传到对应 Release。
name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt pywebview pyinstaller pillow
      - name: 设备无关回归测试
        run: |
          $env:ADB = "$env:ANDROID_HOME\platform-tools\adb.exe"
          python -m unittest discover -s tests -v
      - name: 读版本号
        id: ver
        run: |
          $v = python gui/version.py
          "ver=$v" >> $env:GITHUB_OUTPUT
      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --distpath gui/dist --workpath gui/build gui/windows.spec
      - name: 冒烟测试（命令行、GUI 页面、图片与 JS API）
        run: |
          $env:ADB = "$env:ANDROID_HOME\platform-tools\adb.exe"
          $env:ADBUTILS_ADB_PATH = $env:ADB
          python gui/smoke_test.py gui\dist\AndroidAdCleaner\aac-cli.exe --gui
      - name: 便携版 zip
        run: Compress-Archive -Path gui/dist/AndroidAdCleaner -DestinationPath "gui/dist/AndroidAdCleaner-${{ steps.ver.outputs.ver }}-windows-portable.zip"
      - name: 安装程序（Inno Setup）
        run: |
          try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile gui/ChineseSimplified.isl } catch { Write-Host "中文语言包下载失败，安装界面用英文" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAPPVER=${{ steps.ver.outputs.ver }}" gui/installer.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows-${{ steps.ver.outputs.ver }}
          path: |
            gui/dist/*.zip
            gui/dist/*-setup.exe
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "没有对应的 Release：自动创建草稿（检查说明后手动发布）。"
            gh release create $tag --draft --generate-notes --title $tag
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 草稿失败" }
            $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          }
          if (-not $release.isDraft) {
            Write-Host "Release 已公开，保留已验证文件及 SHA256，不用重建产物覆盖。"
            exit 0
          }
          $files = Get-ChildItem gui/dist/*.zip, gui/dist/*-setup.exe
          # SHA256 校验值：安装引导文案让用户核对 SHA256SUMS.txt（baidu_rows / 官网下载页）
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content gui/dist/SHA256SUMS.txt -Encoding ascii
          foreach ($file in ($files + @(Get-Item gui/dist/SHA256SUMS.txt))) {
            if ($release.assets.name -contains $file.Name) {
              Write-Host "已存在，保留：$($file.Name)"
              continue
            }
            gh release upload $tag $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "上传失败：$($file.Name)" }
          }
