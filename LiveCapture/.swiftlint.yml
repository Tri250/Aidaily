# SwiftLint 配置 - LiveCapture 项目
# 运行: swiftlint --strict

# 排除的路径
excluded:
  - .build
  - DerivedData
  - Pods
  - LiveCaptureTests
  - LiveCaptureUITests

# 全局规则
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - convenience_type
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - nimble_operator
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - unowned_syntactic_sugar
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - xct_specific_matcher
  - yoda_condition

# 禁用的规则
disabled_rules:
  - trailing_whitespace
  - multiple_closures_with_trailing_closure
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - identifier_name

# 自定义规则参数
force_unwrapping:
  severity: error

force_cast:
  severity: warning

force_try:
  severity: warning

# 命名规则
type_name:
  min_length: 3
  max_length: 50
  excluded:
    - ID
    - URL
    - VM

# 文件头注释
file_header:
  required_pattern: |
    \/\/
    \/\/  .*?\.swift
    \/\/  LiveCapture
    \/\/
    \/\/

# 缩进
indentation_width:
  indentation_width: 1
  include_comments: false

# 空行规则
vertical_whitespace:
  max_empty_lines: 2